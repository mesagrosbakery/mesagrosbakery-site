<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Βουτήματα – Κουλουράκια – Παξιμαδάκια | Αρτοποιείο Μεσαγρός</title>
<style>
:root{--ink:#2b2119;--cream:#fffaf1;--paper:#fff;--accent:#9a5b2d;--muted:#75675c}
*{box-sizing:border-box}
html,body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}
header{background:#f1dfc5;padding:25px 15px;text-align:center;border-bottom:1px solid #e1c8a8}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0;color:var(--muted)}
.container{max-width:850px;margin:auto;padding:20px 15px 70px}
.back{display:inline-block;margin-bottom:18px;text-decoration:none;color:var(--ink);background:#f0e2d0;padding:10px 15px;border-radius:20px;font-weight:bold}
.hero-image{width:100%;height:250px;object-fit:cover;border-radius:16px;display:block;box-shadow:0 4px 15px #00000012;margin-bottom:22px}
.card{background:#fff;border:1px solid #eee4d8;border-radius:16px;padding:22px;box-shadow:0 4px 15px #0000000a}
.title{text-align:center;margin-top:0;font-size:26px}
.price{text-align:center;font-size:21px;font-weight:800;color:var(--accent);margin-bottom:22px}
label{display:block;font-weight:bold;margin:16px 0 7px}
select{width:100%;padding:13px;border:1px solid #dcc9b4;border-radius:10px;background:#fff;font-size:16px}
.total{margin-top:18px;text-align:center;font-size:20px;font-weight:bold}
.cart-btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:var(--accent);color:white;font-size:17px;font-weight:bold;cursor:pointer}
.cart-btn.added{background:#4f7d3a}
.note{text-align:center;color:var(--muted);font-size:14px;margin-top:12px}
.cart-link{display:block;text-align:center;margin-top:18px;text-decoration:none;background:#2b2119;color:white;padding:12px;border-radius:11px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>🍪 Βουτήματα – Κουλουράκια – Παξιμαδάκια</h1>
<p>Αρτοποιείο Μεσαγρός • Παραδοσιακές γεύσεις</p>
</header>
<main class="container">
<a class="back" href="index.html">← Επιστροφή στον κατάλογο</a>
<img class="hero-image" src="voutimata-koulourakia-paximadakia.png" alt="Βουτήματα – Κουλουράκια – Παξιμαδάκια">
<div class="card">
<h2 class="title">Επιλέξτε τι θέλετε</h2>
<div class="price">12,00 € / κιλό</div>
<label for="item">Είδος</label>
<select id="item">
<option>Κουλουράκι βανίλιας</option>
<option>Κουλουράκι κανέλας</option>
<option>Κουλουράκι πορτοκαλιού</option>
<option>Κουλουράκι νηστίσιμο με μέλι και σουσάμι</option>
<option>Κουλουράκι μούστου</option>
<option>Πτιφούρ</option>
<option>Παξιμαδάκι αμυγδάλου</option>
<option>Παξιμαδάκι καρυδιού</option>
<option>Παξιμαδάκι βανίλιας</option>
<option>Παξιμαδάκι σταφίδας</option>
<option>Παξιμαδάκι γλυκάνισου</option>
<option>Παξιμαδάκι κακάο</option>
<option>Ομπρελάκι γεμιστό με σοκολάτα</option>
<option>Μπατόν σαλέ</option>
</select>
<label for="weight">Ποσότητα</label>
<select id="weight" onchange="updateTotal()">
<option value="250">250 g</option>
<option value="500">500 g</option>
<option value="750">750 g</option>
<option value="1000">1 kg</option>
</select>
<div class="total" id="total">Τιμή: 3,00 €</div>
<button class="cart-btn" id="addButton" onclick="addToCart()">🛒 Προσθήκη στο καλάθι</button>
<div class="note">Μπορείτε να πατήσετε «Προσθήκη στο καλάθι» ξανά για να προσθέσετε την ίδια επιλογή περισσότερες φορές.</div>
<a class="cart-link" href="kalathi.html">🛒 Μετάβαση στο καλάθι</a>
</div>
</main>
<script>
const kiloPrice=12;
function updateTotal(){
 const grams=Number(document.getElementById('weight').value);
 const price=Math.round(kiloPrice*grams/1000*100)/100;
 document.getElementById('total').textContent='Τιμή: '+price.toFixed(2).replace('.',',')+' €';
}
function addToCart(){
 const item=document.getElementById('item').value;
 const grams=Number(document.getElementById('weight').value);
 const price=Math.round(kiloPrice*grams/1000*100)/100;
 const displayName=item+' ('+(grams===1000?'1 kg':grams+' g')+')';
 let cart=JSON.parse(localStorage.getItem('mesagrosCart'))||[];
 const existing=cart.find(x=>x.name===displayName);
 if(existing){existing.quantity++;}else{cart.push({name:displayName,price:price,quantity:1});}
 localStorage.setItem('mesagrosCart',JSON.stringify(cart));
 const button=document.getElementById('addButton');
 const old=button.innerHTML;
 button.innerHTML='✓ Προστέθηκε!';
 button.classList.add('added');
 setTimeout(()=>{button.innerHTML=old;button.classList.remove('added');},1200);
}
updateTotal();
</script>
</body>
</html>
