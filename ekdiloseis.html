<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Εκδηλώσεις | Αρτοποιείο Μεσαγρός</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f8f1e5;color:#3b2a20}
.container{max-width:950px;margin:0 auto;padding:35px 20px 70px}
.logo{width:180px;max-width:70%;height:auto;display:block;margin:0 auto 20px}
.back{display:inline-block;margin-bottom:25px;color:#7a4b2a;text-decoration:none;font-weight:bold}
.message{background:white;border-radius:22px;padding:55px 25px;text-align:center;box-shadow:0 5px 22px #00000012;border:1px solid #eee4d8}
.icon{font-size:68px;margin-bottom:10px}h1{font-size:40px;margin:10px 0 15px}
.subtitle{font-size:22px;color:#7a4b2a;font-weight:bold;margin-bottom:25px}
.notice{font-size:27px;font-weight:800;line-height:1.4;margin:20px auto;max-width:700px}
.small{font-size:18px;color:#6f6259;line-height:1.6}
@media(max-width:600px){h1{font-size:31px}.notice{font-size:23px}.subtitle{font-size:19px}}
</style>
</head>
<body>
<div class="container">
<img src="LOGO.png" alt="Αρτοποιείο Μεσαγρός" class="logo">
<a href="index.html" class="back">← Επιστροφή στον κατάλογο</a>
<div class="message">
<div class="icon">🎉</div>
<h1>Εκδηλώσεις</h1>
<div class="subtitle">Γάμοι • Βαφτίσεις • Μνημόσυνα</div>
<div class="notice">Η σελίδα μας είναι υπό κατασκευή.<br>Σύντομα κοντά σας!</div>
<div class="small">Ετοιμάζουμε την ενότητα για να σας προσφέρουμε περισσότερες πληροφορίες και επιλογές.</div>
</div>
</div>
</body>
</html>
