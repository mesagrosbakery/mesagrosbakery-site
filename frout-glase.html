<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Φρουίτ Γλασέ | Αρτοποιείο Μεσαγρός</title><style>:root{--ink:#2b2119;--cream:#fffaf1;--paper:#fff;--accent:#9a5b2d;--muted:#75675c}*{box-sizing:border-box}html,body{margin:0;width:100%;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}header{padding:34px 18px;text-align:center;background:#f1dfc5 url('header-background.png') center/cover no-repeat;border-bottom:1px solid #e1c8a8}.site-logo{width:220px;max-width:80%;height:auto;display:block;margin:0 auto}.back{text-align:center;margin:15px 0}.back a{display:inline-block;background:#7a4b2a;color:white;padding:11px 20px;border-radius:12px;text-decoration:none;font-weight:bold}.container{max-width:760px;margin:auto;padding:22px 15px 90px}.card{background:var(--paper);border-radius:15px;overflow:hidden;box-shadow:0 4px 15px #0000000a;border:1px solid #eee4d8}.photo{height:360px;background:#eee0cc;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:18px}.body h1{margin:0 0 8px;font-size:30px;text-align:center}.desc{text-align:center;color:var(--muted);font-size:15px;line-height:1.5}.price{text-align:center;font-size:21px;font-weight:bold;margin:12px 0 20px}.choice-label{font-weight:bold;margin:14px 0 7px}.select{width:100%;padding:11px;border:1px solid #dcc9b4;border-radius:8px;background:#fff;font-size:16px}.selected-price{text-align:center;font-size:22px;font-weight:bold;margin:16px 0}.cart-btn{width:100%;padding:12px;border:0;border-radius:10px;background:#9a5b2d;color:white;font-size:17px;font-weight:bold;cursor:pointer}.back-bottom{text-align:center;margin-top:22px}.back-bottom a{color:#7a4b2a;font-weight:bold;text-decoration:none}@media(max-width:600px){.photo{height:300px}.body h1{font-size:27px}}</style></head><body><header><div style="text-align:center;margin-bottom:20px;"><h1 style="font-size:36px;margin:0 0 8px;font-weight:800;letter-spacing:1px;">ΑΡΤΟΠΟΙΕΙΟ ΜΕΣΑΓΡΟΣ</h1><div style="font-size:20px;font-weight:600;margin-bottom:12px;">ΜΕΣΑΓΡΟΣ • ΓΕΡΑΣ • ΛΕΣΒΟΣ</div><div style="font-size:28px;font-weight:800;letter-spacing:2px;margin-bottom:5px;">BAKERY MESAGROS</div><div style="font-size:17px;">Mesagros • Geras • Lesvos</div></div><img src="LOGO.png" alt="Αρτοποιείο Μεσαγρός" class="site-logo"></header><div class="back"><a href="kalathi.html">🛒 Καλάθι Παραγγελίας</a></div><main class="container"><div class="card"><div class="photo"><img src="frout-glase-inside.png" alt="Φρουίτ Γλασέ"></div><div class="body"><h1>Φρουίτ Γλασέ</h1><div class="desc">Φρουίτ γλασέ σε τρεις γεύσεις</div><div class="price">14,00 € / κιλό</div><div class="choice-label">Επιλέξτε γεύση:</div><select id="flavor" class="select"><option value="Βερίκοκο">Βερίκοκο</option><option value="Νεράντζι">Νεράντζι</option><option value="Αχλάδι">Αχλάδι</option></select><div class="choice-label">Επιλέξτε ποσότητα:</div><select id="grams" class="select" onchange="updatePrice()"><option value="50">50 g</option><option value="100">100 g</option><option value="150">150 g</option><option value="200">200 g</option><option value="250">250 g</option><option value="500">500 g</option><option value="750">750 g</option><option value="1000">1 kg</option></select><div class="selected-price">Τιμή: <span id="price">0,70 €</span></div><button class="cart-btn" onclick="addToCart()">🛒 Προσθήκη στο καλάθι</button></div></div><div class="back-bottom"><a href="glyka(1).html#kerasmata">← Επιστροφή στα Κεράσματα</a></div></main><script>function updatePrice(){const grams=Number(document.getElementById('grams').value);const price=Math.round(14*grams/1000*100)/100;document.getElementById('price').textContent=price.toFixed(2).replace('.',',')+' €'}function addToCart(){const flavor=document.getElementById('flavor').value;const grams=Number(document.getElementById('grams').value);const price=Math.round(14*grams/1000*100)/100;const displayGrams=grams===1000?'1 kg':grams+' g';const name='Φρουίτ Γλασέ - '+flavor+' ('+displayGrams+')';let cart=JSON.parse(localStorage.getItem('mesagrosCart'))||[];const existing=cart.find(item=>item.name===name);if(existing){existing.quantity++}else{cart.push({name:name,price:price,quantity:1})}localStorage.setItem('mesagrosCart',JSON.stringify(cart));const btn=document.querySelector('.cart-btn');const old=btn.innerHTML;btn.innerHTML='✓ Προστέθηκε!';btn.style.background='#4f7d3a';setTimeout(()=>{btn.innerHTML=old;btn.style.background='#9a5b2d'},1200)}updatePrice();</script></body></html>
