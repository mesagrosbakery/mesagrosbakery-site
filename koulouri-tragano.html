<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Κουλούρι Πιο Τραγανό | Αρτοποιείο Μεσαγρός</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f4ed;
      color: #3d2b1f;
    }

    header {
      background-image: url("header-background.png");
      background-size: cover;
      background-position: center;
      min-height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
    }

    .header-content {
      background: rgba(255,255,255,0.88);
      padding: 15px 30px;
      border-radius: 15px;
    }

    .header-content h1 {
      margin: 0;
      font-size: 30px;
    }

    .header-content p {
      margin: 5px 0 0;
      font-size: 17px;
    }

    .product-page {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: #7a4b28;
      text-decoration: none;
      font-weight: bold;
    }

    .product-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
      display: flex;
      gap: 40px;
      align-items: center;
    }

    .product-image {
      width: 48%;
    }

    .product-image img {
      width: 100%;
      display: block;
      border-radius: 18px;
    }

    .product-info {
      flex: 1;
    }

    .product-info h2 {
      font-size: 34px;
      margin-top: 0;
      margin-bottom: 15px;
    }

    .description {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .quantity-box input {
      width: 70px;
      padding: 10px;
      font-size: 17px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .add-cart {
      display: inline-block;
      border: none;
      background: #7a4b28;
      color: white;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-cart:hover {
      opacity: 0.9;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
      display: none;
    }

    @media (max-width: 700px) {
      .product-card {
        flex-direction: column;
        padding: 20px;
      }

      .product-image {
        width: 100%;
      }

      .product-info h2 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">
    <h1>Αρτοποιείο Μεσαγρός</h1>
    <p>Μεσαγρός, Γέρας Λέσβου</p>
  </div>
</header>

<main class="product-page">

  <a href="index.html" class="back-link">
    ← Επιστροφή στον κατάλογο
  </a>

  <div class="product-card">

    <div class="product-image">
      <img src="koulouri-tragano.png" alt="Κουλούρι πιο τραγανό">
    </div>

    <div class="product-info">

      <h2>Κουλούρι πιο τραγανό</h2>

      <div class="description">
        Τραγανό κουλούρι με σουσάμι, φτιαγμένο καθημερινά
        στο Αρτοποιείο Μεσαγρός.
      </div>

      <div class="price">
        0,70 € / τεμάχιο
      </div>

      <div class="quantity-box">
        <label for="quantity">Ποσότητα:</label>
        <input
          type="number"
          id="quantity"
          value="1"
          min="1"
        >
      </div>

      <button class="add-cart" onclick="addToCart()">
        🛒 Προσθήκη στο καλάθι
      </button>

      <div class="message" id="message">
        Το προϊόν προστέθηκε στο καλάθι!
      </div>

    </div>

  </div>

</main>

<script>
function addToCart() {

  const quantity = parseInt(
    document.getElementById("quantity").value
  );

  if (!quantity || quantity < 1) {
    return;
  }

  let cart = JSON.parse(
    localStorage.getItem("cart") || "[]"
  );

  const productName = "Κουλούρι πιο τραγανό";
  const price = 0.70;

  const existing = cart.find(
    item => item.name === productName
  );

  if (existing) {
    existing.quantity += quantity;
  } else {
    cart.push({
      name: productName,
      price: price,
      quantity: quantity
    });
  }

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

  document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
