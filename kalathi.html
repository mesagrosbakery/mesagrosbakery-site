<!DOCTYPE html>
<html lang="el">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Καλάθι Παραγγελίας | Αρτοποιείο Μεσαγρός</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f8f1e5;
color:#3b2a20;
}

.container{
max-width:900px;
margin:auto;
padding:30px 20px 50px;
}

.logo{
width:180px;
display:block;
margin:0 auto 20px;
}

h1{
text-align:center;
margin-bottom:5px;
}

.subtitle{
text-align:center;
color:#7a4b2a;
margin-bottom:30px;
}

.cart{
background:white;
border-radius:18px;
padding:22px;
margin-top:30px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.cart h2{
margin-top:0;
}

.empty{
text-align:center;
padding:20px;
color:#777;
}

.cart-item{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:14px 0;
border-bottom:1px solid #eadfd2;
}

.item-name{
flex:1;
}

.item-controls{
display:flex;
align-items:center;
gap:8px;
}

.qty-button{
width:32px;
height:32px;
border:0;
border-radius:8px;
background:#eadfd2;
font-size:18px;
cursor:pointer;
}

.qty{
font-weight:bold;
min-width:25px;
text-align:center;
}

.remove{
border:0;
background:#999;
color:white;
border-radius:7px;
padding:6px 9px;
cursor:pointer;
}

.total{
text-align:right;
font-size:22px;
font-weight:bold;
margin:20px 0;
}

.email-button{
display:block;
width:100%;
padding:15px;
border:0;
border-radius:12px;
background:#d44638;
color:white;
font-size:19px;
font-weight:bold;
cursor:pointer;
}

.clear-button{
display:block;
width:100%;
padding:11px;
margin-top:10px;
border:0;
border-radius:10px;
background:#eee;
color:#555;
font-size:15px;
cursor:pointer;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#7a4b2a;
text-decoration:none;
font-weight:bold;
}

</style>

</head>


<body>


<div class="container">


<img
src="LOGO.png"
alt="Αρτοποιείο Μεσαγρός"
class="logo"
>


<h1>
🛒 Καλάθι Παραγγελίας
</h1>


<div class="subtitle">

Αρτοποιείο Μεσαγρός

</div>


<div class="cart">


<h2>
Τα προϊόντα σας
</h2>


<div
id="cartItems"
class="empty"
>
Το καλάθι είναι άδειο.
</div>


<div
class="total"
id="cartTotal"
>
Σύνολο: 0,00 €
</div>

<div style="
margin-top:25px;
padding:20px;
background:#f8f1e5;
border-radius:14px;
">

<h3 style="margin-top:0;">
👤 Στοιχεία πελάτη
</h3>

<input
id="customerName"
type="text"
placeholder="Ονοματεπώνυμο *"
style="
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
">

<input
id="customerPhone"
type="tel"
placeholder="Τηλέφωνο *"
style="
width:100%;
padding:12px;
margin-bottom:20px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
">

<h3>
📍 Στοιχεία παράδοσης
</h3>

<input
id="customerArea"
type="text"
placeholder="Περιοχή / Χωριό *"
style="
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
">

<input
id="customerAddress"
type="text"
placeholder="Διεύθυνση *"
style="
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
">

<input
id="customerNumber"
type="text"
placeholder="Αριθμός *"
style="
width:100%;
padding:12px;
margin-bottom:20px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
">

<h3>
📝 Παρατηρήσεις
</h3>

<textarea
id="customerNotes"
placeholder="Προαιρετικά, γράψτε κάποια παρατήρηση..."
style="
width:100%;
min-height:90px;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
resize:vertical;
">
</textarea>

</div>
</div>


<button
class="email-button"
onclick="sendOrder()"
>
📧 Αποστολή παραγγελίας μέσω Gmail
</button>


<button
class="clear-button"
onclick="clearCart()"
>
🗑️ Άδειασμα καλαθιού
</button>


</div>


<a
href="index.html"
class="back"
>
← Επιστροφή στον κατάλογο
</a>


</div>



<script>


/* ================================= */
/* ΔΙΑΒΑΖΟΥΜΕ ΤΟ ΙΔΙΟ ΚΑΛΑΘΙ */
/* ================================= */


let cart =
JSON.parse(
localStorage.getItem("mesagrosCart")
) || [];



/* ================================= */
/* ΕΜΦΑΝΙΣΗ ΚΑΛΑΘΙΟΥ */
/* ================================= */


function renderCart(){


let box =
document.getElementById("cartItems");


let total =
document.getElementById("cartTotal");


if(cart.length === 0){

box.className = "empty";

box.innerHTML =
"Το καλάθι είναι άδειο.";

total.innerHTML =
"Σύνολο: 0,00 €";

return;

}


box.className = "";


let html = "";

let sum = 0;


cart.forEach(
(item,index) => {


let subtotal =
item.price *
item.quantity;


sum += subtotal;


let itemName = item.name;
let itemDescription = "";

let isPastakia = item.name.startsWith("Παστάκια");

if(isPastakia){

    let parts = item.name.split(" — ");

    itemName = parts[0];

    itemDescription = parts[1] || "";

}

html += `

<div class="cart-item">

<div class="item-name">

<strong>
${itemName}
</strong>

${isPastakia ? `
<div style="
margin-top:5px;
font-size:14px;
line-height:1.6;
color:#666;
">
${itemDescription.replaceAll(", ", "<br>")}
</div>
` : ""}

${!isPastakia ? `
<br>
${item.price
.toFixed(2)
.replace(".",",")
} € / τεμάχιο
` : ""}

</div>


<div class="item-controls">

${isPastakia ? "" : `

<button
class="qty-button"
onclick="decrease(${index})"
>
−
</button>

<span class="qty">
${item.quantity}
</span>

<button
class="qty-button"
onclick="increase(${index})"
>
+
</button>

`}

<button
class="remove"
onclick="removeItem(${index})"
>
×
</button>

</div>


</div>

`;

});


box.innerHTML = html;


total.innerHTML =

"Σύνολο: " +

sum
.toFixed(2)
.replace(".",",") +

" €";

}



/* ================================= */
/* ΑΥΞΗΣΗ */
/* ================================= */


function increase(index){

cart[index].quantity++;

saveCart();

renderCart();

}



/* ================================= */
/* ΜΕΙΩΣΗ */
/* ================================= */


function decrease(index){

cart[index].quantity--;


if(cart[index].quantity <= 0){

cart.splice(index,1);

}


saveCart();

renderCart();

}



/* ================================= */
/* ΔΙΑΓΡΑΦΗ */
/* ================================= */


function removeItem(index){

cart.splice(index,1);

saveCart();

renderCart();

}



/* ================================= */
/* ΑΠΟΘΗΚΕΥΣΗ */
/* ================================= */


function saveCart(){

localStorage.setItem(
"mesagrosCart",
JSON.stringify(cart)
);

}



/* ================================= */
/* ΑΔΕΙΑΣΜΑ ΚΑΛΑΘΙΟΥ */
/* ================================= */


function clearCart(){

if(cart.length === 0){

return;

}


if(
confirm(
"Θέλετε να αδειάσετε το καλάθι;"
)
){

cart = [];

saveCart();

renderCart();

}

}



/* ================================= */
/* ΑΠΟΣΤΟΛΗ ΣΤΟ GMAIL */
/* ================================= */


function sendOrder(){

    if(cart.length === 0){

        alert("Το καλάθι είναι άδειο.");

        return;
    }


    /* ================================= */
    /* ΣΤΟΙΧΕΙΑ ΠΕΛΑΤΗ */
    /* ================================= */

    let customerName =
        document.getElementById("customerName").value.trim();

    let customerPhone =
        document.getElementById("customerPhone").value.trim();

    let customerArea =
        document.getElementById("customerArea").value.trim();

    let customerAddress =
        document.getElementById("customerAddress").value.trim();

    let customerNumber =
        document.getElementById("customerNumber").value.trim();

    let customerNotes =
        document.getElementById("customerNotes").value.trim();


    /* ================================= */
    /* ΕΛΕΓΧΟΣ ΥΠΟΧΡΕΩΤΙΚΩΝ ΠΕΔΙΩΝ */
    /* ================================= */

    if(
        !customerName ||
        !customerPhone ||
        !customerArea ||
        !customerAddress ||
        !customerNumber
    ){

        alert(
            "Παρακαλώ συμπληρώστε όλα τα υποχρεωτικά στοιχεία."
        );

        return;
    }


    /* ================================= */
    /* ΘΕΜΑ EMAIL */
    /* ================================= */

    let subject =
        "🛒 Νέα παραγγελία - Αρτοποιείο Μεσαγρός";


    /* ================================= */
    /* ΑΡΧΗ EMAIL */
    /* ================================= */

    let body =
        "🍞 ΑΡΤΟΠΟΙΕΙΟ ΜΕΣΑΓΡΟΣ\n" +
        "ΝΕΑ ΠΑΡΑΓΓΕΛΙΑ\n\n" +

        "━━━━━━━━━━━━━━━━━━━━\n\n" +

        "🛒 ΠΡΟΪΟΝΤΑ\n\n";


    /* ================================= */
    /* ΠΡΟΪΟΝΤΑ */
    /* ================================= */

    let sum = 0;

    cart.forEach(item => {

        let subtotal =
            item.price * item.quantity;

        sum += subtotal;

        body +=
            "• " +
            item.name +
            " × " +
            item.quantity +
            " — " +
            subtotal
                .toFixed(2)
                .replace(".",",") +
            " €\n";

    });


    /* ================================= */
    /* ΣΥΝΟΛΟ */
    /* ================================= */

    body +=
        "\n━━━━━━━━━━━━━━━━━━━━\n\n" +

        "💰 ΣΥΝΟΛΟ: " +
        sum
            .toFixed(2)
            .replace(".",",") +
        " €\n\n" +

        "━━━━━━━━━━━━━━━━━━━━\n\n";


    /* ================================= */
    /* ΣΤΟΙΧΕΙΑ ΠΕΛΑΤΗ */
    /* ================================= */

    body +=
        "👤 ΣΤΟΙΧΕΙΑ ΠΕΛΑΤΗ\n\n" +

        "Όνομα: " +
        customerName +
        "\n" +

        "Τηλέφωνο: " +
        customerPhone +
        "\n\n" +

        "📍 ΣΤΟΙΧΕΙΑ ΠΑΡΑΔΟΣΗΣ\n\n" +

        "Περιοχή / Χωριό: " +
        customerArea +
        "\n" +

        "Διεύθυνση: " +
        customerAddress +
        "\n" +

        "Αριθμός: " +
        customerNumber +
        "\n\n" +

        "📝 ΠΑΡΑΤΗΡΗΣΕΙΣ\n\n" +

        (
            customerNotes
                ? customerNotes
                : "Δεν υπάρχουν παρατηρήσεις."
        ) +

        "\n\n" +

        "━━━━━━━━━━━━━━━━━━━━\n\n" +

        "Αρτοποιείο Μεσαγρός\n" +
        "Μεσαγρός, Γέρας Λέσβου";


    /* ================================= */
    /* ΑΝΟΙΓΜΑ GMAIL */
    /* ================================= */

    let gmailUrl =

        "https://mail.google.com/mail/?view=cm" +

        "&fs=1" +

        "&to=mesagrosbakery%40gmail.com" +

        "&su=" +

        encodeURIComponent(subject) +

        "&body=" +

        encodeURIComponent(body);


    /*
     * Υπολογιστής:
     * ανοίγουμε το Gmail στον browser όπως πριν.
     *
     * Κινητό:
     * χρησιμοποιούμε mailto ώστε το κινητό να ανοίξει
     * την προεπιλεγμένη εφαρμογή email (π.χ. Gmail)
     * με παραλήπτη, θέμα και έτοιμη παραγγελία.
     */
    const isMobile =
        /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if(isMobile){

        const mailtoUrl =
            "mailto:mesagrosbakery@gmail.com" +
            "?subject=" +
            encodeURIComponent(subject) +
            "&body=" +
            encodeURIComponent(body);

        window.location.href = mailtoUrl;

    }else{

        window.open(gmailUrl, "_blank");

    }

    /*
     * Η παραγγελία έχει ήδη δημιουργηθεί.
     * Καθαρίζουμε το καλάθι ώστε ο πελάτης να ξεκινήσει
     * με άδειο καλάθι όταν επιστρέψει στο site.
     */
    cart = [];
    localStorage.removeItem("mesagrosCart");
    renderCart();

}

/* ================================= */
/* ΑΡΧΙΚΗ ΕΜΦΑΝΙΣΗ */
/* ================================= */


renderCart();

</script>


</body>

</html>
