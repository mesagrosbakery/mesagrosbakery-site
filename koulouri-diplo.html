<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Κουλούρι διπλό – Αρτοποιείο Μεσαγρός</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f0e3;
    color:#3b2a1f;
}

.container{
    max-width:900px;
    margin:0 auto;
    padding:25px 20px 50px;
}

.logo{
    width:180px;
    max-width:70%;
    display:block;
    margin:0 auto 15px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    padding:10px 18px;
    background:#5b3a29;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.product{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,0.12);
}

.product-image{
    width:100%;
    display:block;
    height:auto;
}

.content{
    padding:25px;
}

h1{
    text-align:center;
    font-size:32px;
    margin:0 0 18px;
}

.description{
    font-size:18px;
    line-height:1.7;
    text-align:center;
}

.footer{
    text-align:center;
    margin-top:30px;
    font-size:15px;
    color:#6b5545;
}
</style>
</head>

<body>

<div class="container">

    <img src="LOGO.png" alt="Αρτοποιείο Μεσαγρός" class="logo">

    <a href="index.html" class="back">← Επιστροφή στον κατάλογο</a>

    <div class="product">

        <img src="koulouri-diplo.png"
             alt="Κουλούρι διπλό"
             class="product-image">

        <div class="content">

            <h1>Κουλούρι διπλό</h1>

            <div class="description">
                Διπλό κουλούρι με άφθονο σουσάμι,
                τραγανή κόρα και αφράτη ψίχα.
                <br><br>
                Φρέσκο καθημερινά από το Αρτοποιείο Μεσαγρός.
            </div>

        </div>

    </div>

    <div class="footer">
        ΑΡΤΟΠΟΙΕΙΟ ΜΕΣΑΓΡΟΣ<br>
        Μεσαγρός • Γέρας • Λέσβος
    </div>

</div>

</body>
</html>
